# inkphp — 宝塔面板「伪静态」规则
# 用法：网站 → 设置 → 网站目录：「运行目录」选 /public 并保存 → 伪静态：粘贴本文件全部内容 → 保存。
# 路由不在 nginx 里：public/ 里存在的文件（assets/、uploads/、favicon.ico …）由 nginx 直接返回，
# 其余请求全部交给 public/index.php。完整步骤与注意事项见 deploy/README.md「宝塔面板」。

# 隐藏文件和目录（.git、.env.php、.htaccess …）一律 404；/.well-known/ 例外（SSL 证书验证要用）
location ~ /\.(?!well-known/) {
    return 404;
}

# 上传目录：只当静态文件返回，里面的 .php 绝不执行；浏览器也不会把访客上传的文件当网页运行（nosniff + CSP sandbox）。
# 宝塔自带的 PHP 规则（enable-php-XX.conf）排在伪静态前面，会执行 public/ 下的任何 .php 文件；
# 只有 ^~ 前缀规则能抢在它前面，所以这里必须写 ^~。
location ^~ /uploads/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    location ~ /\. { return 404; }
    location ~* \.(php\d?|phtml|phar)$ { return 404; }
}

location / {
    try_files $uri /index.php$is_args$args;
}
