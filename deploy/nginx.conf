# inkphp — nginx server block (one server {}; drop it into /etc/nginx/sites-available/<app>.conf and
# symlink it into sites-enabled/, or into conf.d/). Lines marked "CHANGE" must be edited.
#
# Routing is NOT done here. nginx only does: "if public/ has this file, send it; otherwise run public/index.php".
# Everything else (Cloudflare real IP, own FPM pool, permissions, 宝塔, Apache) is explained in deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    # HTTPS (certificate from certbot, Cloudflare Origin CA, …):
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/ssl/certs/example.com.pem;
    # ssl_certificate_key /etc/ssl/private/example.com.key;
    # Once every visitor reaches the site over HTTPS (and you are sure you will keep it), add HSTS:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_name example.com www.example.com;            # CHANGE
    root /srv/example/public;                            # CHANGE: must be the public/ directory, never the project root

    server_tokens off;
    charset utf-8;
    client_max_body_size 8m;    # upload limit; keep it ≥ store_upload()'s $maxBytes and PHP's post_max_size

    # Behind Cloudflare: restore the visitor IP so client_ip() / rate_limit() see it (deploy/README.md):
    # include /etc/nginx/snippets/cloudflare-realip.conf;

    # Hidden files and directories (.git, .env.php, .htaccess, …) → 404. /.well-known/ stays reachable (ACME).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Every *.php URL (also .php5, .phtml, .phar …) goes to the router, which 301s it to the URL without ".php"
    # or answers 404. So no PHP file under public/ is ever executed or served, except index.php through @ink.
    location ~* \.(php\d?|phtml|phar)$ {
        try_files /__never__ @ink;
    }

    # Static assets. asset() links /assets/x.css?v=<mtime>, so a changed file gets a new URL.
    location /assets/ {
        try_files $uri @ink;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Files saved by store_upload(): random names, whitelisted types; never executed (see the .php rule above).
    # Visitors' files are served from this origin, so the browser must never run them as a page: nosniff, and a
    # CSP sandbox (no scripts, no same-origin access) if a crafted file is opened directly.
    location /uploads/ {
        try_files $uri @ink;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    # Anything else: a real file under public/ is sent as is, everything else runs the router.
    location / {
        try_files $uri @ink;
    }

    location @ink {
        include fastcgi_params;                                    # first, so the lines below override it
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;              # $realpath_root: works with symlinked releases
        fastcgi_param HTTP_PROXY      "";                          # httpoxy
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;                # CHANGE: preferably this app's own pool
        # Never add fastcgi_param PHP_VALUE / PHP_ADMIN_VALUE here: on a shared FPM pool those settings
        # stay in the worker and leak into other sites' requests. Put them in the app's own pool instead.
    }
}
