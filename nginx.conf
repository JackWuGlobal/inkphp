events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        root /Users/jerry/Projects/inkphp;
        index index.php index.html;

        # ============================================================
        # 0. 错误页面配置
        # ============================================================
        error_page 403 /_errors/403.html;
        error_page 404 /_errors/404.html;
        error_page 500 502 503 504 /_errors/500.html;

        # 允许访问 _errors 目录（例外处理）
        location ^~ /_errors/ {
            internal;
        }

        # ============================================================
        # 1. 移除 URL 末尾的斜杠（永久重定向）
        # 排除根目录 /
        # ============================================================
        rewrite ^(.+)/$ $1 permanent;

        # ============================================================
        # 2. 去除冗余的 /index 和 /index.php 路径（优先处理）
        # 例如: /index -> /
        #       /index.php -> /
        #       /index/123 -> /123
        #       /index.php/123 -> /123
        # ============================================================
        set $index_redirect "";
        if ($request_uri ~ ^/index\.php(/.*)?(\?.*)?$) {
            set $index_path $1;
            set $index_query $2;
            set $index_redirect "yes";
        }
        if ($request_uri ~ ^/index(/.*)?(\?.*)?$) {
            set $index_path $1;
            set $index_query $2;
            set $index_redirect "yes";
        }
        # 如果路径为空，设置为 /
        if ($index_path = "") {
            set $index_path "/";
        }
        if ($index_redirect = "yes") {
            return 301 $index_path$index_query;
        }

        # ============================================================
        # 3. 静态资源处理（优先于后缀移除规则）
        # ============================================================
        location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff|woff2|ico|ttf|eot|webp|mp4|mp3|pdf|zip)$ {
            # 如果文件不存在则返回 404
            try_files $uri =404;

            # 开发环境：禁用缓存
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";

            # 生产环境：取消注释下面两行，注释掉上面三行
            # expires 30d;
            # add_header Cache-Control "public, immutable";
        }

        # ============================================================
        # 4. 移除 URL 中的任何文件后缀（排除静态资源）
        # 例如: /product.php/123 -> /product/123
        #       /product.asdasdafaw?id=1 -> /product?id=1
        #       /product.xyz/123/specs -> /product/123/specs
        # ============================================================
        # 先标记是否为静态资源
        set $is_static 0;
        if ($request_uri ~* \.(css|js|jpg|jpeg|png|gif|svg|woff|woff2|ico|ttf|eot|webp|mp4|mp3|pdf|zip)(\?.*)?$) {
            set $is_static 1;
        }

        # 匹配路径部分带任意后缀的情况（带 PATH_INFO），排除静态资源
        set $do_ext_redirect "";
        if ($request_uri ~ ^/([^?/]+)\.[^?/]+(/[^?]*)(\?.*)?$) {
            set $path_without_ext /$1;
            set $path_info $2;
            set $query_string_part $3;
            set $do_ext_redirect "yes";
        }
        if ($is_static = 1) {
            set $do_ext_redirect "";
        }
        if ($do_ext_redirect = "yes") {
            return 301 $path_without_ext$path_info$query_string_part;
        }

        # 匹配查询参数部分带任意后缀的情况（仅查询字符串），排除静态资源
        set $do_ext_redirect2 "";
        if ($request_uri ~ ^/([^?/]+)\.[^?/]+(\?.*)$) {
            set $path_without_ext /$1;
            set $query_string_part $2;
            set $do_ext_redirect2 "yes";
        }
        if ($is_static = 1) {
            set $do_ext_redirect2 "";
        }
        if ($do_ext_redirect2 = "yes") {
            return 301 $path_without_ext$query_string_part;
        }

        # 匹配仅文件名带任意后缀的情况（无 PATH_INFO 和查询参数），排除静态资源
        set $do_ext_redirect3 "";
        if ($request_uri ~ ^/([^?/]+)\.[^?/]+$) {
            set $do_ext_redirect3 "yes";
            set $path_without_ext /$1;
        }
        if ($is_static = 1) {
            set $do_ext_redirect3 "";
        }
        if ($do_ext_redirect3 = "yes") {
            return 301 $path_without_ext;
        }

        # ============================================================
        # 5. 禁止访问下划线开头的私有文件/目录
        # ============================================================
        location ~ ^/_ {
            # _errors 目录已在上面单独配置
            deny all;
            return 403;
        }

        # ============================================================
        # 6. 核心路由：从右向左物理寻址（10 层）
        # ============================================================

        location / {
            # 安全防护：超过 10 层路径直接返回 404
            if ($uri ~ "^(/[^/]+){11,}") { return 404; }

            # 根目录
            if ($uri = "/") { rewrite ^ /index.php last; }

            # L10: 完整路径.php
            if (-f "$document_root$uri.php") { rewrite ^(.*)$ $1.php last; }

            # L9-L1: 从右向左逐级回溯
            set $b9 ""; set $s9 "";
            if ($uri ~ "^(.*)/([^/]+)$") { set $b9 $1; set $s9 /$2; }
            if (-f "$document_root$b9.php") { rewrite ^ $b9.php$s9 last; }

            set $b8 ""; set $s8 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)$") { set $b8 $1; set $s8 /$2/$3; }
            if (-f "$document_root$b8.php") { rewrite ^ $b8.php$s8 last; }

            set $b7 ""; set $s7 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)/([^/]+)$") { set $b7 $1; set $s7 /$2/$3/$4; }
            if (-f "$document_root$b7.php") { rewrite ^ $b7.php$s7 last; }

            set $b6 ""; set $s6 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)/([^/]+)/([^/]+)$") { set $b6 $1; set $s6 /$2/$3/$4/$5; }
            if (-f "$document_root$b6.php") { rewrite ^ $b6.php$s6 last; }

            set $b5 ""; set $s5 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)$") { set $b5 $1; set $s5 /$2/$3/$4/$5/$6; }
            if (-f "$document_root$b5.php") { rewrite ^ $b5.php$s5 last; }

            set $b4 ""; set $s4 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)$") { set $b4 $1; set $s4 /$2/$3/$4/$5/$6/$7; }
            if (-f "$document_root$b4.php") { rewrite ^ $b4.php$s4 last; }

            set $b3 ""; set $s3 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)$") { set $b3 $1; set $s3 /$2/$3/$4/$5/$6/$7/$8; }
            if (-f "$document_root$b3.php") { rewrite ^ $b3.php$s3 last; }

            set $b2 ""; set $s2 "";
            if ($uri ~ "^(.*)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)$") { set $b2 $1; set $s2 /$2/$3/$4/$5/$6/$7/$8/$9; }
            if (-f "$document_root$b2.php") { rewrite ^ $b2.php$s2 last; }

            set $b1 ""; set $s1 "";
            if ($uri ~ "^/([^/]+)/(.*)$") { set $b1 /$1; set $s1 /$2; }
            if (-f "$document_root$b1.php") { rewrite ^ $b1.php$s1 last; }

            # 最终回退: index.php（$uri 作为 PATH_INFO）
            rewrite ^/(.+)$ /index.php/$1 last;
        }

        # ============================================================
        # 7. PHP 处理 + PATH_INFO 分解
        # ============================================================
        location ~ ^(.+\.php)(/.*)?$ {
            # $1 = PHP 文件路径 (如 /debug.php)
            # $2 = PATH_INFO 部分 (如 /123/edit)

            set $script_name $1;
            set $path_info $2;

            # 安全检查：确保 PHP 文件物理存在
            if (!-f $document_root$script_name) {
                return 404;
            }

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            # 核心参数
            fastcgi_param SCRIPT_FILENAME $document_root$script_name;
            fastcgi_param SCRIPT_NAME $script_name;
            fastcgi_param PATH_INFO $path_info;

            include fastcgi_params;
        }
    }
}